# Perfil de producción: arrancar con  --spring.profiles.active=prod  (o SPRING_PROFILES_ACTIVE=prod)
spring.thymeleaf.cache=true
# La cookie solo viaja por HTTPS (requiere servir la app detrás de HTTPS)
server.servlet.session.cookie.secure=true
# Sin páginas de error con trazas ni mensajes internos
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
